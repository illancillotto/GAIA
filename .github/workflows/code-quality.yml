name: code-quality-ci

on:
  push:
    branches:
      - main
    paths:
      - "backend/app/**"
      - "frontend/src/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "modules/elaborazioni/worker/**"
      - "config/code-quality/**"
      - "docs/code-quality/**"
      - "reports/code-quality/**"
      - "scripts/check_changed_worker_coverage.py"
      - "scripts/check_changed_python_style.py"
      - "scripts/complexity_ci_gate.sh"
      - "ruff.toml"
      - "skills/gaia-complexity-reduction/**"
      - "tests/code_quality/**"
      - "tools/code_quality/**"
      - ".github/workflows/code-quality.yml"
      - "AGENTS.md"
      - "Makefile"
  pull_request:
    paths:
      - "backend/app/**"
      - "frontend/src/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "modules/elaborazioni/worker/**"
      - "config/code-quality/**"
      - "docs/code-quality/**"
      - "reports/code-quality/**"
      - "scripts/check_changed_worker_coverage.py"
      - "scripts/check_changed_python_style.py"
      - "scripts/complexity_ci_gate.sh"
      - "ruff.toml"
      - "skills/gaia-complexity-reduction/**"
      - "tests/code_quality/**"
      - "tools/code_quality/**"
      - ".github/workflows/code-quality.yml"
      - "AGENTS.md"
      - "Makefile"

permissions:
  contents: read

jobs:
  complexity-ratchet:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install quality test dependency
        run: python -m pip install pytest

      - name: Install frontend parser dependency graph
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Test complexity tooling
        run: make quality-test QUALITY_PYTHON=python

      - name: Enforce complexity ratchet
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          QUALITY_PYTHON: python
        run: scripts/complexity_ci_gate.sh
