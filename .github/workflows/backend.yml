name: backend-ci

on:
  push:
    paths:
      - "backend/**"
      - "modules/elaborazioni/worker/**"
      - "scripts/check_shared_deps.py"
      - "scripts/check_changed_backend_coverage.py"
      - "scripts/check_changed_worker_coverage.py"
      - "Makefile"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "modules/elaborazioni/worker/**"
      - "scripts/check_shared_deps.py"
      - "scripts/check_changed_backend_coverage.py"
      - "scripts/check_changed_worker_coverage.py"
      - "Makefile"
      - ".github/workflows/backend.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gaia_test
          POSTGRES_USER: gaia_test
          POSTGRES_PASSWORD: gaia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gaia_test -d gaia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r modules/elaborazioni/worker/requirements.txt

      - name: Shared dependency guardrail
        run: |
          python scripts/check_shared_deps.py \
            backend/requirements.txt \
            modules/elaborazioni/worker/requirements.txt

      - name: Syntax check
        working-directory: backend
        run: python -m compileall app tests

      - name: Test suite with coverage
        working-directory: backend
        env:
          GAIA_TEST_POSTGRES_URL: postgresql+psycopg://gaia_test:gaia_test@localhost:5432/gaia_test
        run: |
          pytest -q \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=json:coverage.json \
            --cov-report=xml:coverage.xml

      - name: Upload backend coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.json
            backend/coverage.xml
          if-no-files-found: error

      - name: Enforce changed-file backend coverage
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python scripts/check_changed_backend_coverage.py \
            --coverage-json backend/coverage.json \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --min-coverage 100

      - name: Worker tests with isolated collection and coverage
        run: make test-worker WORKER_PYTHON=python

      - name: Upload worker coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worker-coverage
          path: |
            backend/coverage-worker.json
            backend/coverage-worker.xml
          if-no-files-found: error

      - name: Enforce changed-file worker coverage
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python scripts/check_changed_worker_coverage.py \
            --coverage-json backend/coverage-worker.json \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --min-coverage 100
