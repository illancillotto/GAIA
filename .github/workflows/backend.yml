name: backend-ci

on:
  push:
    paths:
      - "backend/**"
      - "modules/elaborazioni/worker/**"
      - "config/code-quality/**"
      - "docs/code-quality/**"
      - "reports/code-quality/**"
      - "scripts/check_shared_deps.py"
      - "scripts/check_changed_backend_coverage.py"
      - "scripts/complexity_ci_gate.sh"
      - "tests/code_quality/**"
      - "tools/code_quality/**"
      - "Makefile"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "modules/elaborazioni/worker/**"
      - "config/code-quality/**"
      - "docs/code-quality/**"
      - "reports/code-quality/**"
      - "scripts/check_shared_deps.py"
      - "scripts/check_changed_backend_coverage.py"
      - "scripts/complexity_ci_gate.sh"
      - "tests/code_quality/**"
      - "tools/code_quality/**"
      - "Makefile"
      - ".github/workflows/backend.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Install frontend parser dependency graph
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Shared dependency guardrail
        run: |
          python scripts/check_shared_deps.py \
            backend/requirements.txt \
            modules/elaborazioni/worker/requirements.txt

      - name: Syntax check
        working-directory: backend
        run: python -m compileall app tests

      - name: Test suite with coverage
        working-directory: backend
        run: |
          pytest -q \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=json:coverage.json \
            --cov-report=xml:coverage.xml

      - name: Upload backend coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.json
            backend/coverage.xml
          if-no-files-found: error

      - name: Enforce changed-file backend coverage
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python scripts/check_changed_backend_coverage.py \
            --coverage-json backend/coverage.json \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --min-coverage 100

      - name: GAIA differential complexity gate
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
        run: scripts/complexity_ci_gate.sh
