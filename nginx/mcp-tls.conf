include /etc/nginx/gaia/mcp-http.conf;

server {
  listen 443 ssl;
  server_name _;
  ssl_certificate /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  include /etc/nginx/gaia/mcp-server.conf;
  include /etc/nginx/gaia/server-routes.conf;
}
