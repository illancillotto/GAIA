location ~ ^/(api/wiki/mcp/connector/(data|oauth/(authorize|consent|token|revoke))|\.well-known/(oauth-authorization-server/api/wiki/mcp/connector/oauth|oauth-protected-resource/api/wiki/mcp/connector/data))$ {
  if ($maintenance_mode = 1) {
    return 503;
  }
  set $mcp_connector_upstream gaia-mcp-connector:8769;
  proxy_pass http://$mcp_connector_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header Authorization $http_authorization;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_buffering off;
  proxy_read_timeout 60s;
  client_max_body_size 64k;
  limit_req zone=gaia_mcp_connector burst=20 nodelay;
  limit_req_status 429;
  access_log off;
  add_header Cache-Control "no-store" always;
  add_header Referrer-Policy "no-referrer" always;
}

location = /mcp/consent {
  if ($maintenance_mode = 1) {
    return 503;
  }
  set $mcp_consent_frontend frontend:3000;
  proxy_pass http://$mcp_consent_frontend;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  access_log off;
  add_header Cache-Control "no-store" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}
